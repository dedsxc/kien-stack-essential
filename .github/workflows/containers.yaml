name: "Containers"

# Builds every image under containers/<name>/ (Dockerfile + VERSION, optional PLATFORM).
# - pull request: build, scan with Trivy, post the result as a PR comment (nothing is pushed)
# - push to main: build and push ghcr.io/<owner>/<name>:<VERSION> and :latest
# - daily: rebuild and push every image, so base image security fixes land without a code change
# Uses the built-in GITHUB_TOKEN: no secret to create. See docs/CONTAINERS.md.

on:
  pull_request:
    paths: ["containers/**", ".github/workflows/containers.yaml"]
  push:
    branches: [main]
    paths: ["containers/**"]
  schedule:
    - cron: "0 2 * * *" # daily, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: List images to build
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(find containers -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | xargs -rn1 basename | sort -u)
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null \
             || git diff --name-only "$BASE" HEAD | grep -q '^.github/workflows/containers.yaml$'; then
            list="$all"
          else
            list=$(git diff --name-only "$BASE" HEAD -- containers | cut -d/ -f2 | sort -u | grep -Fx -f <(printf '%s\n' "$all") || true)
          fi
          echo "images: $list"
          echo "matrix=$(printf '%s\n' "$list" | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      DIR: containers/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read version and platforms
        id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < "$DIR/VERSION")" >> "$GITHUB_OUTPUT"
          echo "platform=$(tr -d '[:space:]' < "$DIR/PLATFORM" 2>/dev/null || echo linux/amd64)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        run: docker buildx build --load -t "local/${{ matrix.image }}:pr" "$DIR"

      - name: Scan with Trivy
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:pr
          format: json
          output: trivy.json

      - name: Write PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          [ -f trivy.json ] || echo '{}' > trivy.json
          c(){ jq --arg s "$1" '[.Results[]?.Vulnerabilities[]? | select(.Severity==$s)] | length' trivy.json; }
          critical=$(c CRITICAL); high=$(c HIGH); medium=$(c MEDIUM); low=$(c LOW)
          total=$((critical + high + medium + low))
          {
            echo "### Trivy scan: \`${{ matrix.image }}\`"
            echo
            echo "Critical: **$critical** · High: **$high** · Medium: **$medium** · Low: **$low**"
            echo
            if [ "$total" -eq 0 ]; then echo "No vulnerabilities found."; else
              echo "<details><summary>Show $total vulnerabilities</summary>"; echo
              echo "| Severity | Package | Vulnerability | Installed | Fixed |"; echo "|---|---|---|---|---|"
              jq -r 'def r: {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"UNKNOWN":4};
                [.Results[]?.Vulnerabilities[]?] | sort_by(r[.Severity]) | .[] |
                "| \(.Severity) | \(.PkgName) | [\(.VulnerabilityID)](\(.PrimaryURL // "")) | \(.InstalledVersion) | \(.FixedVersion // "-") |"' trivy.json
              echo; echo "</details>"
            fi
          } > trivy-comment.md

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-${{ matrix.image }}
          path: trivy-comment.md

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build --push --platform "${{ steps.meta.outputs.platform }}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${{ steps.meta.outputs.ref }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.ref }}:latest" "$DIR"
