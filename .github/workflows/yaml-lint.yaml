---
name: "YAML: lint"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yaml-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: "1.38.0"

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install yamllint
        run: pipx install "yamllint==${YAMLLINT_VERSION}"
      # Rules: .yamllint.yaml at the repo root (warnings fail too).
      - name: yamllint
        run: yamllint --strict --format github .
