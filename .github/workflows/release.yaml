name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: [self-hosted, coder]
    env:
      HAS_APP: ${{ secrets.BOT_APP_ID != '' }}
    steps:
      # Optional GitHub App (secrets BOT_APP_ID + BOT_APP_PRIV_KEY): the release PR
      # then triggers CI, so it can pass required status checks. Without it, the
      # default token is used and CI does not run on the release PR.
      - name: Generate app token
        if: env.HAS_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIV_KEY }}

      # Opens/updates a release PR from conventional commits (feat:, fix:, deps:...).
      # Merging that PR creates the vX.Y.Z tag and the GitHub release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
