---
name: "Renovate"

# Self-hosted Renovate. Not needed if the Mend Renovate GitHub App is installed on the repo.
# Requires the repository secret RENOVATE_TOKEN (fine-grained PAT: contents, pull requests,
# issues, workflows = read/write on this repo). Without it the job is skipped. See docs/CI.md.

on:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (no branch / PR created)
        type: boolean
        default: false
      logLevel:
        description: Log level
        type: choice
        options: [info, debug]
        default: info
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate.yaml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
        with:
          config_file_path: .github/renovate.json5

  renovate:
    name: Renovate
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RENOVATE_TOKEN != '' }}
    steps:
      - name: Skip if RENOVATE_TOKEN is missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::RENOVATE_TOKEN secret not set, skipping self-hosted Renovate (see docs/CI.md)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_TOKEN == 'true'
      - name: Renovate
        if: env.HAS_TOKEN == 'true'
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: "enabled"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
