# chart-testing config (ct lint / ct install)
target-branch: main
chart-dirs:
  - helm/platform
  - helm/apps
check-version-increment: false
validate-maintainers: false
validate-chart-schema: true
helm-extra-args: --timeout 300s
# Upstream Helm repos of the wrapped charts (ct lint rebuilds dependencies; OCI deps need nothing)
chart-repos:
  - argoproj-github-io-argo-helm=https://argoproj.github.io/argo-helm
  - charts-external-secrets-io=https://charts.external-secrets.io
  - charts-jetstack-io=https://charts.jetstack.io
  - cloudnative-pg-github-io-charts=https://cloudnative-pg.github.io/charts
  - dl-cloudsmith-io-public-infisical-helm-charts-helm-charts=https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
  - helm-cilium-io=https://helm.cilium.io/
  - kubernetes-sigs-github-io-external-dns=https://kubernetes-sigs.github.io/external-dns/
  - kubernetes-sigs-github-io-metrics-server=https://kubernetes-sigs.github.io/metrics-server/
  - openebs-github-io-openebs=https://openebs.github.io/openebs
  - stakater-github-io-stakater-charts=https://stakater.github.io/stakater-charts
  - traefik-github-io-charts=https://traefik.github.io/charts
