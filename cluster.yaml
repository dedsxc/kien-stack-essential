# cluster.yaml: YOUR settings. ArgoCD passes this file to every chart (helm/platform/* and helm/apps/*)
# after its own values.yaml (see valueFiles in argocd/applications/*/appset.yaml). Edit, push, done.
# https://shop.kien.cc/install.sh fills it in for you on the first install.
global:
  # Apps get <name>.<domain>, e.g. argocd.example.com. No domain? <node-ip>.sslip.io
  domain: example.com
  # ClusterIssuer of the Gateway certificates: selfsigned-ca | letsencrypt
  issuer: selfsigned-ca
  ingressClass: traefik
  # Apps exposed on the Gateway (traefik/traefik): one HTTPS listener + certificate <app>.<domain> each.
  # Your own app in helm/apps/<app>: add it here, then an HTTPRoute (app-template "route:", see hello).
  gatewayHosts:
    - argocd
    - infisical
    - hello
  tls:
    # selfsigned | letsencrypt-http01 | letsencrypt-dns01 (then issuer: letsencrypt)
    issuer: selfsigned
    email: admin@example.com
    staging: false
    dns01:
      provider: cloudflare
      secretName: dns01-api-token
      secretKey: api-token
  secrets:
    # none | infisical (creates the ClusterSecretStore "infisical" for External Secrets)
    provider: none
    infisical:
      hostAPI: https://app.infisical.com
      projectSlug: my-project
      environmentSlug: prod
      credentialsSecret: infisical-universal-auth

# Per-brick settings (key = upstream chart name, same as in helm/platform/<brick>/values.yaml).
traefik:
  service:
    spec:
      # LoadBalancer (cloud, k3s, minikube tunnel, Cilium L2) | NodePort
      type: LoadBalancer
  # NodePort only: the IP your browser uses to reach the node
  # providers:
  #   kubernetesIngress:
  #     publishedService: {enabled: false}
  #     ingressEndpoint: {ip: 192.168.1.10}

# OpenEBS hostpath as the default StorageClass (cluster without one)
# openebs:
#   localpv-provisioner:
#     hostpathClass:
#       isDefaultClass: true

# Cilium (enable helm/platform/cilium in argocd/applications/platform/appset.yaml first)
# cilium:
#   k8sServiceHost: 192.168.1.10
#   k8sServicePort: 6443
#   ipam:
#     mode: cluster-pool
#     operator:
#       clusterPoolIPv4PodCIDRList: [10.42.0.0/16]
# Homelab L2 load balancer IPs (needs Cilium)
# ciliumLB:
