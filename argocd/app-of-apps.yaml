# Root Application. install.sh applies this file as is; repoURL/targetRevision = your fork.
# Watches argocd/applications (kustomize): AppProjects + ApplicationSets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dedsxc/kien-stack-essential.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
