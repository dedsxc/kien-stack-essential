# One Application per folder in helm/apps/ (your apps): add helm/apps/<name>/, push, done.
# repoURL/revision: your fork (same as argocd/app-of-apps.yaml). Values: values.yaml + /cluster.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/dedsxc/kien-stack-essential.git
        revision: e2e-ess-boot
        directories:
          - path: "helm/apps/*"
  template:
    metadata:
      name: "{{ .path.basename }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      source:
        repoURL: https://github.com/dedsxc/kien-stack-essential.git
        targetRevision: e2e-ess-boot
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basename }}"
          # Your settings: see /cluster.yaml
          valueFiles:
            - values.yaml
            - ../../../cluster.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
