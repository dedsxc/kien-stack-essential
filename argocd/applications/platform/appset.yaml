# One Application per folder in helm/platform/ (the base platform). Exceptions in templatePatch.
# repoURL/revision: your fork (same as argocd/app-of-apps.yaml). Values: values.yaml + /cluster.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/dedsxc/kien-stack-essential.git
        revision: e2e-ess-boot
        directories:
          - path: "helm/platform/*"
          # Optional bricks: remove the entry to enable
          - path: helm/platform/cilium
            exclude: true
          - path: helm/platform/external-dns
            exclude: true
  # Per-app exceptions (target namespace)
  templatePatch: |
    {{- if eq .path.basename "cloudnative-pg" }}
    spec:
      destination: {namespace: cnpg-system}
    {{- else if has .path.basename (list "metrics-server" "cilium") }}
    spec:
      destination: {namespace: kube-system}
    {{- end }}
  template:
    metadata:
      name: "{{ .path.basename }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/dedsxc/kien-stack-essential.git
        targetRevision: e2e-ess-boot
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basename }}"
          # Your settings: see /cluster.yaml
          valueFiles:
            - values.yaml
            - ../../../cluster.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
