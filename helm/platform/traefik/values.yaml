# Values of the upstream chart go under "traefik:". global.* comes from ArgoCD (domain, issuer...).
traefik:
  ingressClass:
    enabled: true
    isDefaultClass: true
    name: traefik
  ports:
    web:
      # Let HTTP01 challenges through despite the https redirect
      allowACMEByPass: true
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
  service:
    spec:
      type: LoadBalancer
