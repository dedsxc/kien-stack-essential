# Self-hosted Infisical. Postgres: cnpg-cluster chart (below), Valkey: templates/valkey.yaml, same namespace.
# Root secrets (ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL) are generated by install.sh, never in Git.
infisical-standalone:
  infisical:
    replicaCount: 1
    rolloutOnEveryRender: false
    kubeSecretRef: infisical-secrets
    extraEnv:
      - name: DB_CONNECTION_URI
        valueFrom:
          secretKeyRef:
            name: infisical-cnpg
            key: DB_CONNECTION_URI
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        # 1Gi was OOMKilled during DB migrations on first start
        memory: 2Gi
  # Ingress is in our own templates/ingress.yaml
  ingress:
    enabled: false
    nginx:
      enabled: false
  postgresql:
    enabled: false
  redis:
    enabled: false
# Postgres: one small CloudNativePG cluster (infisical-cluster), database/owner "infisical".
# Credentials: secret infisical-cnpg (username, password, DB_HOST, DB_DATABASE, DB_CONNECTION_URI),
# generated by External Secrets (ClusterGenerator password-cluster-generator, external-secrets brick).
# storageClass: set by install.sh from stack.yaml storageClass.
cnpg-cluster:
  cluster:
    instances: 1
    annotations:
      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    storage:
      size: 5Gi
      storageClass: openebs-hostpath
    walStorage:
      size: 1Gi
      storageClass: openebs-hostpath
    enableSuperuserAccess: false
    roles:
      - name: infisical
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: infisical-cnpg
  database:
    list:
      - name: infisical
        owner: infisical
        secretName: infisical-cnpg
# global.* comes from /cluster.yaml (passed to every chart by the ApplicationSets). Defaults:
global:
  domain: example.com
  issuer: selfsigned-ca
  ingressClass: traefik
  storageClass: ""
  tls:
    issuer: selfsigned
    email: ""
    staging: false
    dns01:
      provider: cloudflare
      secretName: dns01-api-token
      secretKey: api-token
  secrets:
    provider: none
    infisical: {}
