# Self-hosted Infisical. Postgres: cnpg-cluster chart (below), Valkey: official valkey chart (valkey.io/valkey-helm), same namespace.
# Root secrets (ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL) are generated by install.sh, never in Git.
infisical-standalone:
  infisical:
    replicaCount: 1
    rolloutOnEveryRender: false
    kubeSecretRef: infisical-secrets
    extraEnv:
      - name: DB_CONNECTION_URI
        valueFrom:
          secretKeyRef:
            name: infisical-cnpg
            key: DB_CONNECTION_URI
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        # 1Gi was OOMKilled during DB migrations on first start
        memory: 2Gi
  # Ingress is in our own templates/ingress.yaml
  ingress:
    enabled: false
    nginx:
      enabled: false
  postgresql:
    enabled: false
  redis:
    enabled: false
# Postgres: one small CloudNativePG cluster (infisical-cluster), database/owner "infisical".
# Credentials: secret infisical-cnpg (username, password, DB_HOST, DB_DATABASE, DB_CONNECTION_URI),
# generated by External Secrets (ClusterGenerator password-cluster-generator, external-secrets brick).
# storageClass: openebs-hostpath (installed by Essential). Cloud cluster: put its StorageClass here.
cnpg-cluster:
  cluster:
    instances: 1
    annotations:
      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    storage:
      size: 5Gi
      storageClass: openebs-hostpath
    walStorage:
      size: 1Gi
      storageClass: openebs-hostpath
    enableSuperuserAccess: false
    roles:
      - name: infisical
        ensure: present
        login: true
        superuser: false
        createdb: false
        # CRD defaults, explicit: otherwise ArgoCD (server-side diff) shows the Cluster OutOfSync forever
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: infisical-cnpg
  database:
    list:
      - name: infisical
        owner: infisical
        secretName: infisical-cnpg
# Valkey (BSD, Redis protocol) for Infisical queues/cache: official chart, no persistence (cache only).
# Service infisical-valkey:6379; password VALKEY_PASSWORD from infisical-secrets (install.sh, never in Git).
valkey:
  auth:
    enabled: true
    usersExistingSecret: infisical-secrets
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: VALKEY_PASSWORD
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 256Mi
