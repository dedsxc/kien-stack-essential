# Passwords generated in-cluster by External Secrets (ClusterGenerator password-cluster-generator), never in Git nor in install.sh.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: infisical-secrets
spec:
  # "0" = generated once, never rotated (a refresh would regenerate the passwords).
  refreshInterval: "0"
  target:
    name: infisical-secrets
    # Orphan: the Secret survives if this ExternalSecret is deleted or renamed,
    # so ENCRYPTION_KEY is never regenerated (new key = all Infisical data unreadable).
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        ENCRYPTION_KEY: {{`'{{ .enc | sha256sum | trunc 32 }}'`}}
        AUTH_SECRET: {{`'{{ .auth | b64enc }}'`}}
        VALKEY_PASSWORD: {{`'{{ .valkey }}'`}}
        REDIS_URL: {{`'redis://:{{ .valkey }}@infisical-valkey.infisical.svc:6379'`}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: enc
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: auth
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: valkey
