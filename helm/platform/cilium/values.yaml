# Cilium: eBPF CNI, replaces kube-proxy, L2 load balancer IPs (no MetalLB).
cilium:
  kubeProxyReplacement: true
  # Service LB in the pod datapath too: required when nodes are containers (k3d, kind), harmless elsewhere
  socketLB:
    hostNamespaceOnly: true
  operator:
    replicas: 1
  bpf:
    masquerade: true
  l2announcements:
    enabled: true
  externalIPs:
    enabled: true
  k8sClientRateLimit:
    qps: 20
    burst: 40
  hubble:
    enabled: true
    relay:
      enabled: false
    ui:
      enabled: false
# Homelab L2 load balancer IPs
ciliumLB:
  enabled: false
  start: ""
  stop: ""
