argo-cd:
  configs:
    params:
      server.insecure: true
    cm:
      resource.exclusions: |
        - apiGroups: [cilium.io]
          kinds: [CiliumIdentity]
  server:
    # Ingress is in templates/ingress.yaml (needs global.domain)
    ingress:
      enabled: false
  dex:
    enabled: false
  notifications:
    enabled: false
