argo-cd:
  configs:
    params:
      server.insecure: true
    cm:
      resource.exclusions: |
        - apiGroups: [cilium.io]
          kinds: [CiliumIdentity]
  server:
    ingress:
      enabled: false
    # https://argocd.<domain>: listener https-argocd of the cluster Gateway (traefik/traefik) gives the hostname
    httproute:
      enabled: true
      parentRefs:
        - name: traefik
          namespace: traefik
          sectionName: https-argocd
      rules:
        - matches:
            - path: {type: PathPrefix, value: /}
  dex:
    enabled: false
  notifications:
    enabled: false
