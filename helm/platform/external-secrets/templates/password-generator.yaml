# Cluster-wide password generator used by the cnpg-cluster chart (oci://ghcr.io/dedsxc/cnpg-cluster):
# every app database secret (<app>-cnpg) and Postgres superuser secret is generated from it.
# Alphanumeric only: the password goes into DB_CONNECTION_URI (postgres://user:pass@host/db) unescaped.
# Wave 1: after the ESO controller/webhook of this app are healthy. App charts that reference it
# (infisical, ...) are separate ArgoCD apps: their ExternalSecrets retry until it exists.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: password-cluster-generator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 32
      digits: 8
      symbols: 0
      noUpper: false
      allowRepeat: true
