# Local PV hostpath only (homelab, k3s, bare metal). No replication: a volume lives on one node's disk.
openebs:
  engines:
    local:
      lvm:
        enabled: false
      zfs:
        enabled: false
      rawfile:
        enabled: false
      hostpath:
        enabled: true
    replicated:
      mayastor:
        enabled: false
  loki:
    enabled: false
  alloy:
    enabled: false
  localpv-provisioner:
    hostpathClass:
      basePath: /var/openebs/local
      isDefaultClass: false
