# global.domain / global.issuer come from /cluster.yaml (ArgoCD valueFiles).
app-template:
  controller:
    containers:
      main:
        image:
          repository: nginx
          tag: "1.27"
          digest: ""
  service:
    main:
      ports:
        http:
          port: 80
  # https://hello.<domain>: listener https-hello of the cluster Gateway (global.gatewayHosts in cluster.yaml)
  route:
    main:
      enabled: true
      kind: HTTPRoute
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik
          namespace: traefik
          sectionName: https-hello
      rules:
        - backendRefs:
            - identifier: main
              port: 80
          matches:
            - path: {type: PathPrefix, value: /}
